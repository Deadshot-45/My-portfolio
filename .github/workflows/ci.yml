name: CI Quality Gate

on:
  push:
    branches: [main, animate]
  pull_request:
    branches: [main, animate]

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/ci_test_db
      AUTH_SECRET: ci_test_auth_secret_minimum_32_characters_long_for_security
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Run unit & integrity test suite
        run: pnpm test

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Verify Next.js production build
        run: pnpm run build
