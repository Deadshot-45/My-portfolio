name: Vercel Deployment Pipeline

on:
  push:
    branches: [main, animate]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs after CI Quality Gate finishes successfully
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vercel Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "Vercel credentials detected. Deploying via Vercel CLI..."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) not configured in GitHub Secrets. If using Vercel GitHub App integration, Vercel deploys automatically upon Git push."
          fi

      - name: Install Vercel CLI
        if: steps.check_credentials.outputs.has_token == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment (Preview)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment (Production)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: steps.check_credentials.outputs.has_token == 'true' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
